name: Build and Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      # Create debug keystore if not present (needed for release signing in CI without proper keystore)
      # For production releases, configure RELEASE_KEYSTORE_* secrets instead
      - name: Create debug keystore for CI
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      
      - name: Build with Gradle
        run: ./gradlew build
      
      - name: Build Debug APK
        run: ./gradlew assembleDebug
      
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Voice-Assistant-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
      
      - name: Build Release APK
        run: ./gradlew assembleRelease
      
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Voice-Assistant-Release-APK
          path: app/build/outputs/apk/release/*.apk
